services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fiduvia
      POSTGRES_PASSWORD: fiduvia
      POSTGRES_DB: fiduvia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fiduvia
      MINIO_ROOT_PASSWORD: fiduvia123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 fiduvia fiduvia123; do sleep 1; done;
      mc mb --ignore-existing local/fiduvia-documents;
      "

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  minio-data:
