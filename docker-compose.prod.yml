# Production stack: the app behind Caddy, with Postgres alongside.
#
# Deliberately absent compared to docker-compose.yml (which is development
# only): MinIO, because production stores documents in Infomaniak's S3, and
# MailHog, because production sends through real SMTP. Both are configured
# through the environment instead — see .env.production.example.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Migrations are NOT run automatically. See docs/deployment.md — the app image
# carries no dev dependencies, so drizzle-kit is not in it.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined into the client bundle at build time, so the
        # canonical/site URL has to be a build arg, not just a runtime variable.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Postgres runs on the compose network, so the app addresses it by
      # service name rather than through the published port.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      CONTACT_EMAIL: ${CONTACT_EMAIL}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_REGION: ${STORAGE_REGION}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      # Payments (server-only) and the marketing analytics ids (loaded after
      # consent). All read at runtime, so no rebuild is needed to change them.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      ANALYTICS_GA_ID: ${ANALYTICS_GA_ID}
      ANALYTICS_META_PIXEL_ID: ${ANALYTICS_META_PIXEL_ID}
      ANALYTICS_GOOGLE_ADS_ID: ${ANALYTICS_GOOGLE_ADS_ID}
    depends_on:
      postgres:
        condition: service_healthy
    # No published port: Caddy is the only thing that should reach the app.
    expose:
      - "3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host: nothing outside this network needs it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Storage for a staging/testing deployment, where there is no Infomaniak
  # bucket yet. Opt in with `--profile bundled-storage`, and point STORAGE_*
  # at http://minio:9000 with the root credentials below. A production
  # deployment leaves this profile off and points STORAGE_* at Infomaniak,
  # which is why it is not in the default set of services.
  minio:
    image: minio/minio:latest
    profiles: ["bundled-storage"]
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    expose:
      - "9000"

  minio-init:
    image: minio/mc:latest
    profiles: ["bundled-storage"]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY_ID} ${STORAGE_SECRET_ACCESS_KEY}; do sleep 1; done;
      mc mb --ignore-existing local/${STORAGE_BUCKET};
      "

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # The Caddyfile reads {$SITE_ADDRESS} from the container's own environment at
    # runtime (it is the site Caddy answers on and gets a certificate for), so it
    # must be passed in here — compose's --env-file only feeds interpolation.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  pgdata:
  minio-data:
  caddy-data:
  caddy-config:
